  <symbol id="icon-log-in" viewBox="0 0 24 24">
    <path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/>
    <path d="M4 12h11"/>
    <path d="M11 8l4 4-4 4"/>
  </symbol>

  <symbol id="icon-arrow-left" viewBox="0 0 24 24">
    <path d="M20 12H4"/>
    <path d="M10 6 4 12l6 6"/>
