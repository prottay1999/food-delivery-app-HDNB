<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    FoodApp icon sprite.
    Usage: <svg class="fd-icon"><use href="icons.svg#icon-cart"></use></svg>
    Every symbol: 24x24 viewBox, stroke-based, stroke-width 1.75, stroke uses currentColor,
    round caps and joins, no fills. Hand-authored, lucide-like geometry.
    The consuming CSS should set: fill:none; stroke:currentColor; stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; width/height 24px.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <symbol id="icon-presentation" viewBox="0 0 24 24">
    <path d="M3 4h18"/>
    <path d="M4 4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V4"/>
    <path d="M12 14v4"/>
    <path d="M9 21l3-3 3 3"/>
  </symbol>

  <symbol id="icon-cart" viewBox="0 0 24 24">
    <circle cx="9" cy="20" r="1.2"/>
    <circle cx="18" cy="20" r="1.2"/>
    <path d="M2 3h2.2l1.9 11.2a1.5 1.5 0 0 0 1.5 1.25h9.1a1.5 1.5 0 0 0 1.47-1.2l1.33-6.55H5.4"/>
  </symbol>

  <symbol id="icon-store" viewBox="0 0 24 24">
    <path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/>
    <path d="M3.5 9l1.4-4.4A1 1 0 0 1 5.85 4h12.3a1 1 0 0 1 .95.6L20.5 9a2.5 2.5 0 0 1-4.25 2 2.5 2.5 0 0 1-4.25 0 2.5 2.5 0 0 1-4.25 0A2.5 2.5 0 0 1 3.5 9Z"/>
    <path d="M9.5 20v-5h5v5"/>
  </symbol>

  <symbol id="icon-headset" viewBox="0 0 24 24">
    <path d="M4 13v-1a8 8 0 0 1 16 0v1"/>
    <path d="M4 14a2 2 0 0 1 2-2h1v6H6a2 2 0 0 1-2-2Z"/>
    <path d="M20 14a2 2 0 0 0-2-2h-1v6h1a2 2 0 0 0 2-2Z"/>
    <path d="M20 18v.5a3 3 0 0 1-3 3h-3"/>
  </symbol>

  <symbol id="icon-bike" viewBox="0 0 24 24">
    <circle cx="5.5" cy="17.5" r="3.2"/>
    <circle cx="18.5" cy="17.5" r="3.2"/>
    <path d="M8.5 17.5h6l-3.5-8H8"/>
    <path d="M14 9.5h3l1.5 8"/>
    <path d="M13.5 6.5h2.2"/>
  </symbol>

  <symbol id="icon-chart" viewBox="0 0 24 24">
    <path d="M4 4v15a1 1 0 0 0 1 1h15"/>
    <path d="M8 15v-3"/>
    <path d="M12 15V8"/>
    <path d="M16 15v-5"/>
  </symbol>

  <symbol id="icon-file-text" viewBox="0 0 24 24">
