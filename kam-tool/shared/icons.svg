    <path d="M14 3v5h5"/>
    <path d="M8.5 13h7"/>
    <path d="M8.5 16.5h7"/>
    <path d="M8.5 9.5h3"/>
  </symbol>

  <symbol id="icon-folder" viewBox="0 0 24 24">
    <path d="M4 6a1 1 0 0 1 1-1h4l2 2.5h8a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/>
  </symbol>

  <symbol id="icon-database" viewBox="0 0 24 24">
