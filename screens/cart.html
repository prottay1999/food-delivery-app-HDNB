<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodApp basket screen</title>
<link rel="icon" href="data:,">
<style>
:root {
  --fd-primary: #0E7A6E;
  --fd-primary-dark: #0A5F56;
  --fd-ink: #1A1D23;
  --fd-grey: #5F6570;
  --fd-grey-light: #9AA0AA;
  --fd-hair: #E4E6EA;
  --fd-bg: #F7F8F9;
  --fd-white: #FFFFFF;
  --fd-radius: 10px;
  --fd-radius-sm: 6px;
  --fd-status-placed: #B45309;
  --fd-status-accepted: #0E7A6E;
  --fd-status-transit: #1D4ED8;
  --fd-status-delivered: #15803D;
  --fd-status-cancelled: #B91C1C;
  --fd-font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", "Nirmala UI", sans-serif;
  --fd-font-bn: "Noto Sans Bengali", "Nirmala UI", sans-serif;
  --fd-shadow-card: 0 1px 2px rgba(26, 29, 35, .04);
  --fd-shadow-pop: 0 8px 28px rgba(26, 29, 35, .12);
  --fd-t: 160ms;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--fd-font);
  color: var(--fd-ink);
  background: var(--fd-bg);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--fd-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
.fd-phone {
  position: relative;
  width: 390px;
  height: 844px;
  flex: none;
  background: var(--fd-white);
  border: 10px solid #12151B;
  border-radius: 44px;
  box-shadow: var(--fd-shadow-pop);
  overflow: hidden;
  transform-origin: center center;
}
@media (max-height: 900px) {
.fd-phone { transform: scale(.92); }
}
@media (max-height: 820px) {
.fd-phone { transform: scale(.86); }
}
@media (max-height: 760px) {
.fd-phone { transform: scale(.80); }
}
@media (max-height: 700px) {
.fd-phone { transform: scale(.74); }
}
.fd-phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 26px;
  background: #12151B;
  border-bottom-left-radius: 14px;
  border-bottom-right-radius: 14px;
  z-index: 5;
}
.bx-stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 20px;
  background: var(--fd-bg);
}
:root { --bx-scale: 1; }
@media (max-height: 900px) {
:root { --bx-scale: 0.95; }
}
@media (max-height: 840px) {
:root { --bx-scale: 0.88; }
}
@media (max-height: 780px) {
:root { --bx-scale: 0.84; }
}
@media (max-height: 720px) {
:root { --bx-scale: 0.76; }
}
.bx-fit {
  width: calc(390px * var(--bx-scale));
  height: calc(844px * var(--bx-scale));
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bx-fit > .fd-phone { transform: scale(var(--bx-scale)); transform-origin: center center; position: relative; }
.bx-app {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--fd-white);
  font-family: var(--fd-font);
  color: var(--fd-ink);
}
.bx-status {
  flex: none;
  height: 34px;
  padding: 8px 26px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
  background: var(--fd-white);
}
.bx-sysicons { width: 38px; height: 12px; fill: currentColor; }
.bx-status-icons .bx-ic { display: none; }
.bx-view { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
.bx-screen, .bx-col { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.bx-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.bx-grow { flex: 1 1 auto; min-width: 0; }
.bx-left { text-align: left; }
.bx-spacer { height: 24px; flex: none; }
.bx-muted { color: var(--fd-grey); font-size: 13px; }
.bx-pad { padding: 12px 16px; }
.bx-money { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.bx-ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.bx-ic-sm { width: 18px; height: 18px; }
.bx-ic-xl { width: 56px; height: 56px; stroke-width: 1.4; }
.bx-hd {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 8px 12px;
  background: var(--fd-white);
  border-bottom: 1px solid var(--fd-hair);
}
.bx-hd-title { font-size: 16px; font-weight: 700; }
.bx-iconbtn {
  position: relative;
  flex: none;
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--fd-white);
  color: var(--fd-ink);
  border: 1px solid var(--fd-hair);
  border-radius: 999px;
  cursor: pointer;
}
.bx-iconbtn:hover { border-color: var(--fd-grey-light); }
.bx-btn:focus-visible, .bx-iconbtn:focus-visible { outline: 2px solid var(--fd-primary); outline-offset: 2px; }
.bx-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 16px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--fd-ink);
  background: var(--fd-white);
  border: 1px solid var(--fd-hair);
  border-radius: var(--fd-radius-sm);
  cursor: pointer;
}
.bx-btn:hover { border-color: var(--fd-grey-light); }
.bx-btn:disabled { opacity: .5; cursor: not-allowed; }
.bx-btn-primary { color: var(--fd-white); background: var(--fd-primary); border-color: var(--fd-primary); }
.bx-btn-primary:hover { background: var(--fd-primary-dark); border-color: var(--fd-primary-dark); }
.bx-btn-block { display: flex; width: 100%; }
.bx-btn-lg { height: 52px; font-size: 16px; }
.bx-rc-name { font-weight: 700; font-size: 14px; }
.bx-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 56px 32px; text-align: center; color: var(--fd-grey); }
.bx-empty h3 { margin: 8px 0 0; font-size: 17px; color: var(--fd-ink); }
.bx-empty p { margin: 0 0 8px; }
.bx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.bx-layer > * { pointer-events: auto; }
.bx-toast {
  position: absolute; left: 24px; right: 24px; bottom: 84px; padding: 12px 16px; text-align: center;
  font-size: 13px; font-weight: 600; color: var(--fd-white); background: var(--fd-ink); border-radius: var(--fd-radius-sm); z-index: 60;
}
.bx-cart-rest { display: flex; align-items: center; gap: 8px; }
.bx-lines { padding-top: 0; }
.bx-line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--fd-hair); }
.bx-nudge { display: flex; align-items: center; gap: 10px; margin: 4px 16px; padding: 12px 14px; font-size: 13px; font-weight: 600; background: var(--fd-white); border: 1px solid var(--fd-hair); border-radius: var(--fd-radius); }
.bx-bill { display: flex; flex-direction: column; gap: 8px; }
.bx-bill-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.bx-foot { flex: none; padding: 10px 16px 14px; background: var(--fd-white); border-top: 1px solid var(--fd-hair); }
@media (max-width: 500px) {
.bx-stage { padding: 0; min-height: 100vh; display: block; }
.bx-fit { width: 100%; height: 100vh; height: 100dvh; display: block; }
.bx-fit > .fd-phone {
    width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; transform: none;
  }
.fd-phone-notch, .bx-status { display: none; }
}
.bx-btn-primary:disabled, .bx-btn-primary:disabled:hover { opacity: 1; color: var(--fd-grey-light); background: var(--fd-hair); border-color: var(--fd-hair); }
</style>
</head>
<body>
<!-- FoodApp basket screen. One file, no other files needed. Open it in a browser. -->
<main class="bx-stage">
  <div class="bx-fit">
    <div class="fd-phone">
      <div class="fd-phone-notch" aria-hidden="true"></div>
      <div class="bx-app">
<div class="bx-status" aria-hidden="true"><span class="bx-status-time">13:10</span><span class="bx-status-icons"><svg viewBox="0 0 40 12" class="bx-sysicons"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="23" y="1" width="16" height="10" rx="2.5" fill="none" stroke="currentColor"/><rect x="25" y="3" width="10" height="6" rx="1"/></svg></span></div><div class="bx-view"><div class="bx-col bx-screen"><div class="bx-hd"><button type="button" class="bx-iconbtn" data-go="Goes back to the previous screen" aria-label="Back"><svg viewBox="0 0 24 24" class="bx-ic " aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></button><div class="bx-hd-title">Your basket</div><div class="bx-grow"></div></div><div class="bx-body" id="body"></div><div class="bx-foot" id="foot"></div></div></div>
        <div class="bx-layer"></div>
      </div>
    </div>
  </div>
</main>
<script>
var ICONS = {"store":"<path d=\"M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9\"/><path d=\"M3.5 9l1.4-4.4A1 1 0 0 1 5.85 4h12.3a1 1 0 0 1 .95.6L20.5 9a2.5 2.5 0 0 1-4.25 2 2.5 2.5 0 0 1-4.25 0 2.5 2.5 0 0 1-4.25 0A2.5 2.5 0 0 1 3.5 9Z\"/>","trash":"<path d=\"M4 7h16\"/><path d=\"M9 7V4h6v3\"/><path d=\"M6 7l1 13h10l1-13\"/>","bike":"<circle cx=\"5.5\" cy=\"17.5\" r=\"3.2\"/><circle cx=\"18.5\" cy=\"17.5\" r=\"3.2\"/><path d=\"M8.5 17.5h6l-3.5-8H8\"/><path d=\"M14 9.5h3l1.5 8\"/>","cart":"<circle cx=\"9\" cy=\"20\" r=\"1.2\"/><circle cx=\"18\" cy=\"20\" r=\"1.2\"/><path d=\"M2 3h2.2l1.9 11.2a1.5 1.5 0 0 0 1.5 1.25h9.1a1.5 1.5 0 0 0 1.47-1.2l1.33-6.55H5.4\"/>"};
var layer = document.querySelector('.bx-layer');
function toast(msg) {
  var old = layer.querySelectorAll('.bx-toast');
  for (var i = 0; i < old.length; i++) { old[i].remove(); }
  var n = document.createElement('div');
  n.className = 'bx-toast'; n.setAttribute('role', 'status'); n.textContent = msg;
  layer.appendChild(n);
  setTimeout(function () { n.remove(); }, 2400);
}
function money(n) {
  var s = String(Math.round(n)), head = s.slice(0, -3), tail = s.slice(-3);
  if (s.length > 3) { s = head.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + tail; }
  return 'Tk ' + s;
}
function icon(name, cls) {
  return '<svg viewBox="0 0 24 24" class="bx-ic ' + (cls || '') + '" aria-hidden="true">' + ICONS[name] + '</svg>';
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

var FREE_DELIVERY_MIN = 500;
var lines = [
  { name: 'Chicken Roast', opts: [], qty: 1, unit: 160 },
  { name: 'Beef Tehari', opts: ['Full'], qty: 1, unit: 270 }
];

function paint() {
  var body = document.getElementById('body'), foot = document.getElementById('foot');
  if (!lines.length) {
    body.innerHTML = '<div class="bx-empty">' + icon('cart', 'bx-ic-xl') + '<h3>Your basket is empty</h3><p class="bx-muted">Add something tasty from a restaurant.</p>' +
      '<button type="button" class="bx-btn bx-btn-primary" data-go="Opens the home screen">Find food</button></div>';
    foot.innerHTML = '';
    return;
  }
  var sub = 0;
  lines.forEach(function (l) { sub += l.unit * l.qty; });
  var free = sub >= FREE_DELIVERY_MIN;
  var h = '<div class="bx-pad"><div class="bx-cart-rest">' + icon('store', 'bx-ic-sm') + '<span class="bx-rc-name">Megh Kacchi House</span></div></div><div class="bx-pad bx-lines">';
  lines.forEach(function (l, i) {
    h += '<div class="bx-line"><div class="bx-grow bx-left"><div class="bx-rc-name">' + esc(l.name) + '</div>' +
      (l.opts.length ? '<div class="bx-muted">' + esc(l.opts.join(', ')) + '</div>' : '') +
      '<div class="bx-muted">Quantity: ' + l.qty + '</div><div class="bx-money">' + money(l.unit * l.qty) + '</div></div>' +
      '<button type="button" class="bx-iconbtn" data-remove="' + i + '" aria-label="Delete">' + icon('trash') + '</button></div>';
  });
  h += '</div><div class="bx-pad"><button type="button" class="bx-btn bx-btn-block" data-go="Opens the restaurant menu">Add more items</button></div>';
  if (!free) {
    h += '<div class="bx-nudge">' + icon('bike', 'bx-ic-sm') + '<span>Add ' + money(FREE_DELIVERY_MIN - sub) + ' more for free delivery</span></div>';
  }
  h += '<div class="bx-pad bx-bill"><div class="bx-bill-row"><span>Subtotal</span><span class="bx-money">' + money(sub) + '</span></div>' +
    '<div class="bx-bill-row"><span>Delivery</span><span class="bx-money">' + (free ? 'Free delivery' : 'Calculated at checkout') + '</span></div></div><div class="bx-spacer"></div>';
  body.innerHTML = h;
  foot.innerHTML = '<button type="button" class="bx-btn bx-btn-primary bx-btn-block bx-btn-lg" data-go="Opens the checkout screen">Go to checkout</button>';
}

document.addEventListener('click', function (e) {
  var rm = e.target.closest('[data-remove]');
  if (rm) { lines.splice(Number(rm.getAttribute('data-remove')), 1); paint(); return; }
  var go = e.target.closest('[data-go]');
  if (go) { toast(go.getAttribute('data-go')); }
});
paint();
</script>
</body>
</html>
