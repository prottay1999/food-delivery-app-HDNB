<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodApp search results screen</title>
<link rel="icon" href="data:,">
<style>
:root {
  --fd-primary: #0E7A6E;
  --fd-primary-dark: #0A5F56;
  --fd-ink: #1A1D23;
  --fd-grey: #5F6570;
  --fd-grey-light: #9AA0AA;
  --fd-hair: #E4E6EA;
  --fd-bg: #F7F8F9;
  --fd-white: #FFFFFF;
  --fd-radius: 10px;
  --fd-radius-sm: 6px;
  --fd-status-placed: #B45309;
  --fd-status-accepted: #0E7A6E;
  --fd-status-transit: #1D4ED8;
  --fd-status-delivered: #15803D;
  --fd-status-cancelled: #B91C1C;
  --fd-font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", "Nirmala UI", sans-serif;
  --fd-font-bn: "Noto Sans Bengali", "Nirmala UI", sans-serif;
  --fd-shadow-card: 0 1px 2px rgba(26, 29, 35, .04);
  --fd-shadow-pop: 0 8px 28px rgba(26, 29, 35, .12);
  --fd-t: 160ms;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--fd-font);
  color: var(--fd-ink);
  background: var(--fd-bg);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--fd-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
.fd-phone {
  position: relative;
  width: 390px;
  height: 844px;
  flex: none;
  background: var(--fd-white);
  border: 10px solid #12151B;
  border-radius: 44px;
  box-shadow: var(--fd-shadow-pop);
  overflow: hidden;
  transform-origin: center center;
}
@media (max-height: 900px) {
.fd-phone { transform: scale(.92); }
}
@media (max-height: 820px) {
.fd-phone { transform: scale(.86); }
}
@media (max-height: 760px) {
.fd-phone { transform: scale(.80); }
}
@media (max-height: 700px) {
.fd-phone { transform: scale(.74); }
}
.fd-phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 26px;
  background: #12151B;
  border-bottom-left-radius: 14px;
  border-bottom-right-radius: 14px;
  z-index: 5;
}
.bx-stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 20px;
  background: var(--fd-bg);
}
:root { --bx-scale: 1; }
@media (max-height: 900px) {
:root { --bx-scale: 0.95; }
}
@media (max-height: 840px) {
:root { --bx-scale: 0.88; }
}
@media (max-height: 780px) {
:root { --bx-scale: 0.84; }
}
@media (max-height: 720px) {
:root { --bx-scale: 0.76; }
}
.bx-fit {
  width: calc(390px * var(--bx-scale));
  height: calc(844px * var(--bx-scale));
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bx-fit > .fd-phone { transform: scale(var(--bx-scale)); transform-origin: center center; position: relative; }
.bx-app {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--fd-white);
  font-family: var(--fd-font);
  color: var(--fd-ink);
}
.bx-status {
  flex: none;
  height: 34px;
  padding: 8px 26px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
  background: var(--fd-white);
}
.bx-sysicons { width: 38px; height: 12px; fill: currentColor; }
.bx-status-icons .bx-ic { display: none; }
.bx-view { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
.bx-screen, .bx-col { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.bx-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.bx-grow { flex: 1 1 auto; min-width: 0; }
.bx-left { text-align: left; }
.bx-muted { color: var(--fd-grey); font-size: 13px; }
.bx-money { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.bx-ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.bx-ic-xs { width: 14px; height: 14px; }
.bx-ic-xl { width: 56px; height: 56px; stroke-width: 1.4; }
.bx-hd {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 8px 12px;
  background: var(--fd-white);
  border-bottom: 1px solid var(--fd-hair);
}
.bx-iconbtn {
  position: relative;
  flex: none;
  width: 38px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--fd-white);
  color: var(--fd-ink);
  border: 1px solid var(--fd-hair);
  border-radius: 999px;
  cursor: pointer;
}
.bx-iconbtn:hover { border-color: var(--fd-grey-light); }
.bx-tabbar {
  flex: none;
  display: flex;
  background: var(--fd-white);
  border-top: 1px solid var(--fd-hair);
  padding: 6px 4px 10px;
}
.bx-tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 4px 0;
  background: none; border: 0;
  font: inherit; font-size: 11px; font-weight: 600;
  color: var(--fd-grey);
  cursor: pointer;
}
.bx-tab.is-active { color: var(--fd-primary); }
.bx-tab:focus-visible, .bx-iconbtn:focus-visible { outline: 2px solid var(--fd-primary); outline-offset: 2px; }
.bx-input {
  width: 100%; height: 44px; padding: 0 12px;
  font-family: inherit; font-size: 15px; color: var(--fd-ink);
  background: var(--fd-white);
  border: 1px solid var(--fd-hair);
  border-radius: var(--fd-radius-sm);
}
.bx-input:focus { outline: none; border-color: var(--fd-primary); box-shadow: 0 0 0 3px rgba(14, 122, 110, .12); }
.bx-input::placeholder { color: var(--fd-grey-light); }
select.bx-input { appearance: auto; }
.bx-tile {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  background: var(--fd-bg);
  color: var(--fd-grey-light);
}
.bx-tile .bx-ic { width: 34px; height: 34px; }
.bx-sec-hd { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
.bx-sec-hd h3 { margin: 0; font-size: 16px; }
.bx-rc {
  display: flex; flex-direction: column; text-align: left; padding: 0;
  font: inherit; color: var(--fd-ink); cursor: pointer; overflow: hidden;
  background: var(--fd-white); border: 1px solid var(--fd-hair); border-radius: var(--fd-radius);
}
.bx-rc .bx-tile { height: 110px; border-radius: 0; }
.bx-rc-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
.bx-rc-name { font-weight: 700; font-size: 14px; }
.bx-rc-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fd-grey); }
.bx-rating { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--fd-ink); }
.bx-rating .bx-ic { fill: var(--fd-ink); }
.bx-searchfield { flex: 1; display: flex; align-items: center; gap: 8px; padding-left: 12px; background: var(--fd-bg); border: 1px solid var(--fd-hair); border-radius: 999px; height: 42px; color: var(--fd-grey); }
.bx-searchfield .bx-input { border: 0; background: transparent; height: 40px; padding: 0; box-shadow: none; }
.bx-searchfield .bx-input::-webkit-search-cancel-button { display: none; }
.bx-searchfield .bx-iconbtn { border: 0; background: transparent; width: 36px; height: 36px; }
.bx-dish { display: flex; align-items: center; gap: 12px; width: calc(100% - 32px); margin: 0 16px 8px; padding: 12px; font: inherit; text-align: left; cursor: pointer; background: var(--fd-white); border: 1px solid var(--fd-hair); border-radius: var(--fd-radius); }
.bx-body > .bx-rc { width: calc(100% - 32px); margin: 0 16px 12px; }
.bx-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 56px 32px; text-align: center; color: var(--fd-grey); }
.bx-empty h3 { margin: 8px 0 0; font-size: 17px; color: var(--fd-ink); }
.bx-empty p { margin: 0 0 8px; }
.bx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.bx-layer > * { pointer-events: auto; }
.bx-toast {
  position: absolute; left: 24px; right: 24px; bottom: 84px; padding: 12px 16px; text-align: center;
  font-size: 13px; font-weight: 600; color: var(--fd-white); background: var(--fd-ink); border-radius: var(--fd-radius-sm); z-index: 60;
}
@media (max-width: 500px) {
.bx-stage { padding: 0; min-height: 100vh; display: block; }
.bx-fit { width: 100%; height: 100vh; height: 100dvh; display: block; }
.bx-fit > .fd-phone {
    width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; transform: none;
  }
.fd-phone-notch, .bx-status { display: none; }
}
</style>
</head>
<body>
<!-- FoodApp search results screen. One file, no other files needed. Open it in a browser. -->
<main class="bx-stage">
  <div class="bx-fit">
    <div class="fd-phone">
      <div class="fd-phone-notch" aria-hidden="true"></div>
      <div class="bx-app">
<div class="bx-status" aria-hidden="true"><span class="bx-status-time">13:10</span><span class="bx-status-icons"><svg viewBox="0 0 40 12" class="bx-sysicons"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="23" y="1" width="16" height="10" rx="2.5" fill="none" stroke="currentColor"/><rect x="25" y="3" width="10" height="6" rx="1"/></svg></span></div><div class="bx-view"><div class="bx-col bx-screen"><div class="bx-hd"><div class="bx-searchfield"><button type="button" class="bx-iconbtn" id="go" aria-label="Search"><svg viewBox="0 0 24 24" class="bx-ic " aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button><input class="bx-input bx-input-search" id="q" type="search" enterkeyhint="search" placeholder="Search restaurants and dishes" aria-label="Search" value="Kacchi Biryani"><button type="button" class="bx-iconbtn" id="clear" aria-label="Clear"><svg viewBox="0 0 24 24" class="bx-ic " aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div><div class="bx-body" id="results"></div></div></div><nav class="bx-tabbar" aria-label="Main"><button type="button" class="bx-tab" data-tab="home"><svg viewBox="0 0 24 24" class="bx-ic " aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></button><button type="button" class="bx-tab is-active" data-tab="search"><svg viewBox="0 0 24 24" class="bx-ic " aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span>Search</span></button><button type="button" class="bx-tab" data-tab="orders"><svg viewBox="0 0 24 24" class="bx-ic " aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Orders</span></button><button type="button" class="bx-tab" data-tab="account"><svg viewBox="0 0 24 24" class="bx-ic " aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Account</span></button></nav>
        <div class="bx-layer"></div>
      </div>
    </div>
  </div>
</main>
<script>
var ICONS = {"bowl":"<path d=\"M4 12h16a8 8 0 0 1-16 0Z\"/><path d=\"M9 8.5c0-1.2.9-1.2.9-2.4M13 8.5c0-1.2.9-1.2.9-2.4\"/>","star":"<path d=\"m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8z\"/>","search":"<circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/><path d=\"M15.5 15.5 21 21\"/>"};
var layer = document.querySelector('.bx-layer');
function toast(msg) {
  var old = layer.querySelectorAll('.bx-toast');
  for (var i = 0; i < old.length; i++) { old[i].remove(); }
  var n = document.createElement('div');
  n.className = 'bx-toast'; n.setAttribute('role', 'status'); n.textContent = msg;
  layer.appendChild(n);
  setTimeout(function () { n.remove(); }, 2400);
}
function money(n) {
  var s = String(Math.round(n)), head = s.slice(0, -3), tail = s.slice(-3);
  if (s.length > 3) { s = head.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + tail; }
  return 'Tk ' + s;
}
function icon(name, cls) {
  return '<svg viewBox="0 0 24 24" class="bx-ic ' + (cls || '') + '" aria-hidden="true">' + ICONS[name] + '</svg>';
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

var DATA = {"restaurants":[{"name":"Ruchi Wok House","rating":"3.8","cuisine":"Chinese","area":"Mohammadpur"},{"name":"Padma Bakery and Cafe","rating":"3.9","cuisine":"Cafe","area":"Banani"},{"name":"Megh Kacchi House","rating":"4.4","cuisine":"Kacchi","area":"Bashundhara"},{"name":"Neel Kacchi House","rating":"4.4","cuisine":"Kacchi","area":"Mohammadpur"},{"name":"Meghna Hotel and Restaurant","rating":"4.5","cuisine":"Bangla","area":"Mohammadpur"},{"name":"Haji Grill and Burger","rating":"3.6","cuisine":"Burger","area":"Mohammadpur"}],"dishes":[["Kacchi Biryani","Megh Kacchi House",520],["Kacchi Biryani","Neel Kacchi House",540],["Kacchi Biryani","Meghna Hotel and Restaurant",480],["Kacchi Biryani","Haji Grill and Burger",495],["Chicken Roast","Megh Kacchi House",160],["Chicken Roast","Neel Kacchi House",170],["Beef Burger","Haji Grill and Burger",320],["Fried Wonton","Ruchi Wok House",210],["Pancake","Padma Bakery and Cafe",240]]};

var q = document.getElementById('q');
var results = document.getElementById('results');

function run() {
  var text = q.value.trim().toLowerCase();
  results.innerHTML = '';
  if (!text) { return; }
  var rs = DATA.restaurants.filter(function (r) { return r.name.toLowerCase() === text; });
  var ds = DATA.dishes.filter(function (d) { return d[0].toLowerCase() === text; });
  if (!rs.length && !ds.length) {
    results.innerHTML = '<div class="bx-empty">' + icon('search', 'bx-ic-xl') + '<h3>No results found</h3></div>';
    return;
  }
  var html = '';
  if (rs.length) {
    html += '<div class="bx-sec-hd"><h3>Restaurants</h3></div>';
    rs.forEach(function (r) {
      html += '<button type="button" class="bx-rc" data-restaurant="' + esc(r.name) + '"><div class="bx-tile">' + icon('bowl') + '</div>' +
        '<div class="bx-rc-body"><div class="bx-rc-name">' + esc(r.name) + '</div><div class="bx-rc-meta"><span class="bx-rating">' +
        icon('star', 'bx-ic-xs') + r.rating + '</span><span>' + r.cuisine + ' &middot; ' + r.area + '</span></div></div></button>';
    });
  }
  if (ds.length) {
    html += '<div class="bx-sec-hd"><h3>Dishes</h3></div>';
    ds.forEach(function (d) {
      html += '<button type="button" class="bx-dish" data-restaurant="' + esc(d[1]) + '"><div class="bx-grow bx-left"><div class="bx-rc-name">' +
        esc(d[0]) + '</div><div class="bx-muted">' + esc(d[1]) + '</div></div><span class="bx-money">' + money(d[2]) + '</span></button>';
    });
  }
  results.innerHTML = html;
}
q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { run(); } });
document.getElementById('go').addEventListener('click', run);
document.getElementById('clear').addEventListener('click', function () { q.value = ''; run(); q.focus(); });
document.addEventListener('click', function (e) {
  var rc = e.target.closest('[data-restaurant]');
  if (rc) { toast('Opens the menu of ' + rc.getAttribute('data-restaurant')); return; }
  var tab = e.target.closest('[data-tab]');
  if (tab && tab.getAttribute('data-tab') !== 'search') { toast('Opens the ' + tab.getAttribute('data-tab') + ' screen'); }
});
run();
</script>
</body>
</html>
